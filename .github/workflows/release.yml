name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  # 1. 发布前强制校验：版本号一致、类型检查、Lint、单元与集成测试
  verify:
    name: Pre-Release Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "Tag version: $TAG_VERSION, package.json version: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check & lint
        run: |
          npm run check
          npm run lint

      - name: Prepare verified sing-box core & run tests
        run: |
          npm run prepare:singbox
          npm test

  # 2. Windows (x64 NSIS) 构建与打包
  build-windows:
    name: Build Windows (x64)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Prepare verified sing-box core
        run: npm run prepare:singbox

      - name: Verify Windows browser, desktop and MCP clients
        uses: ./.github/actions/verify-windows
        env:
          SKIP_DOTENV: 'true'
          DOTENV_CONFIG_PATH: '/dev/null'

      - name: Package Windows installer
        run: npm run package:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: release/*.exe
          if-no-files-found: error
          retention-days: 5

  # 3. macOS (Apple Silicon arm64 DMG & ZIP) 构建与打包
  build-macos:
    name: Build macOS (arm64)
    needs: verify
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package macOS installers
        run: npm run package:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 5

  # 4. Linux (x64 AppImage & DEB) 构建与打包
  build-linux:
    name: Build Linux (x64)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Package Linux installers
        run: npm run package:linux
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
          retention-days: 5

  # 5. 汇总三端产物、生成 SHA256SUMS.txt 并自动发布 GitHub Release
  publish-release:
    name: Publish Multi-Platform Release
    needs: [ build-windows, build-macos, build-linux ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7

      - name: Download all platform artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        shell: bash
        run: |
          cd release-assets
          ls -la
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        continue-on-error: true
        with:
          subject-path: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            release-assets/*.exe
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.AppImage
            release-assets/*.deb
            release-assets/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update release badge on badges branch
        shell: bash
        run: |
          TMP_BADGE_DIR="$(mktemp -d)"
          node scripts/generate-badge-svg.mjs --label="release" --message="${GITHUB_REF_NAME}" --color="#0969da" --out="$TMP_BADGE_DIR/release.svg"
          git fetch origin badges:refs/remotes/origin/badges 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git worktree add "$TMP_BADGE_DIR/repo" origin/badges
          else
            git worktree add --orphan -b badges "$TMP_BADGE_DIR/repo"
          fi
          cp "$TMP_BADGE_DIR/release.svg" "$TMP_BADGE_DIR/repo/release.svg"
          cd "$TMP_BADGE_DIR/repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(release): update release badge to ${GITHUB_REF_NAME}"
            git push origin HEAD:refs/heads/badges
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$TMP_BADGE_DIR/repo" || true
          rm -rf "$TMP_BADGE_DIR"
