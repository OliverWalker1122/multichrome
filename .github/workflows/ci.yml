name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Prepare verified sing-box core for integration tests
        run: npm run prepare:singbox

      - name: Run unit & integration tests with V8 code coverage
        id: run_tests
        shell: bash
        run: |
          set +e
          node scripts/run-coverage.mjs --badge-out=coverage.svg --json-out=coverage-badge.json
          TEST_EXIT=$?
          set -e
          if [ -f coverage-badge.json ]; then
            node -e '
              const fs = require("fs");
              const cov = JSON.parse(fs.readFileSync("coverage-badge.json", "utf8"));
              const total = cov.metrics?.testsTotal || 0;
              const pass = cov.metrics?.testsPassed || 0;
              const fail = cov.metrics?.testsFailed || 0;
              const rate = total > 0 ? ((pass / total) * 100).toFixed(total === pass ? 0 : 1) : "0";
              const color = fail === 0 && total > 0 ? "16a34a" : "dc2626";
              const badge = {
                schemaVersion: 1,
                label: "tests",
                message: `${pass}/${total} passed (${rate}%)`,
                color,
              };
              fs.writeFileSync("test-badge.json", JSON.stringify(badge, null, 2) + "\n");
              console.log(`Test Pass Rate: ${pass}/${total} (${rate}%) | Line Coverage: ${cov.message}`);
            '
            BADGE_MSG="$(node -p "require('./test-badge.json').message")"
            BADGE_COLOR="$(node -p "require('./test-badge.json').color")"
            node scripts/generate-badge-svg.mjs --label="tests" --message="$BADGE_MSG" --color="#$BADGE_COLOR" --out="tests.svg"
          fi
          exit $TEST_EXIT

      - name: Update dynamic test & coverage badges on badges branch
        if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ ! -f test-badge.json ] || [ ! -f tests.svg ]; then
            exit 0
          fi
          TMP_BADGE_DIR="$(mktemp -d)"
          cp test-badge.json "$TMP_BADGE_DIR/test-badge.json"
          cp tests.svg "$TMP_BADGE_DIR/tests.svg"
          [ -f coverage-badge.json ] && cp coverage-badge.json "$TMP_BADGE_DIR/coverage-badge.json"
          [ -f coverage.svg ] && cp coverage.svg "$TMP_BADGE_DIR/coverage.svg"
          git fetch origin badges:refs/remotes/origin/badges 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git worktree add "$TMP_BADGE_DIR/repo" origin/badges
          else
            git worktree add --orphan -b badges "$TMP_BADGE_DIR/repo"
          fi
          cp "$TMP_BADGE_DIR/test-badge.json" "$TMP_BADGE_DIR/repo/test-badge.json"
          cp "$TMP_BADGE_DIR/tests.svg" "$TMP_BADGE_DIR/repo/tests.svg"
          [ -f "$TMP_BADGE_DIR/coverage-badge.json" ] && cp "$TMP_BADGE_DIR/coverage-badge.json" "$TMP_BADGE_DIR/repo/coverage-badge.json"
          [ -f "$TMP_BADGE_DIR/coverage.svg" ] && cp "$TMP_BADGE_DIR/coverage.svg" "$TMP_BADGE_DIR/repo/coverage.svg"
          cd "$TMP_BADGE_DIR/repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-badge.json tests.svg
          [ -f coverage-badge.json ] && git add coverage-badge.json
          [ -f coverage.svg ] && git add coverage.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): update live test and coverage badges"
            git push origin HEAD:refs/heads/badges
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$TMP_BADGE_DIR/repo" || true
          rm -rf "$TMP_BADGE_DIR"

      - name: Build renderer & Electron main
        run: npm run build

      - name: Verify Windows desktop and local MCP clients
        if: runner.os == 'Windows'
        uses: ./.github/actions/verify-windows
        env:
          SKIP_DOTENV: 'true'
          DOTENV_CONFIG_PATH: '/dev/null'
