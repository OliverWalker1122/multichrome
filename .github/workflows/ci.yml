name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Lint
        run: npm run lint

      - name: Prepare verified sing-box core for integration tests
        run: npm run prepare:singbox

      - name: Run unit & integration tests (with pass-rate summary)
        id: run_tests
        shell: bash
        run: |
          set +e
          npm test | tee test-output.tap
          TEST_EXIT=${PIPESTATUS[0]}
          set -e
          node -e '
            const fs = require("fs");
            const txt = fs.readFileSync("test-output.tap", "utf8");
            const total = Number((txt.match(/^# tests (\d+)/m) || [])[1] || 0);
            const pass = Number((txt.match(/^# pass (\d+)/m) || [])[1] || 0);
            const fail = Number((txt.match(/^# fail (\d+)/m) || [])[1] || 0);
            const rate = total > 0 ? ((pass / total) * 100).toFixed(total === pass ? 0 : 1) : "0";
            const color = fail === 0 && total > 0 ? "16a34a" : "dc2626";
            const badge = {
              schemaVersion: 1,
              label: "tests",
              message: `${pass}/${total} passed (${rate}%)`,
              color,
            };
            fs.writeFileSync("test-badge.json", JSON.stringify(badge, null, 2) + "\n");
            const summary = [
              `### Test Summary (${process.env.RUNNER_OS})`,
              "",
              "| Total | Passed | Failed | Pass Rate |",
              "| :---: | :---: | :---: | :---: |",
              `| ${total} | ${pass} | ${fail} | **${rate}%** |`,
              "",
            ].join("\n");
            if (process.env.GITHUB_STEP_SUMMARY) {
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
            }
            console.log(`Test Pass Rate: ${pass}/${total} (${rate}%)`);
          '
          exit $TEST_EXIT

      - name: Update dynamic test badge on badges branch
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if [ ! -f test-badge.json ]; then
            exit 0
          fi
          TMP_BADGE_DIR="$(mktemp -d)"
          cp test-badge.json "$TMP_BADGE_DIR/test-badge.json"
          git fetch origin badges:refs/remotes/origin/badges 2>/dev/null || true
          if git show-ref --verify --quiet refs/remotes/origin/badges; then
            git worktree add "$TMP_BADGE_DIR/repo" origin/badges
          else
            git worktree add --orphan -b badges "$TMP_BADGE_DIR/repo"
          fi
          cp "$TMP_BADGE_DIR/test-badge.json" "$TMP_BADGE_DIR/repo/test-badge.json"
          cd "$TMP_BADGE_DIR/repo"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add test-badge.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(ci): update live test badge"
            git push origin HEAD:refs/heads/badges
          fi
          cd "$GITHUB_WORKSPACE"
          git worktree remove --force "$TMP_BADGE_DIR/repo" || true
          rm -rf "$TMP_BADGE_DIR"

      - name: Build renderer & Electron main
        run: npm run build
